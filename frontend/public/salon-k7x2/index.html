<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#081226">
<title>Magnat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#070F22;--panel:#0E1B36;--panel2:#15284D;--line:#223C6B;--text:#E8EEF9;--mute:#8FA3C7;--cyan:#22D3EE;--amber:#F59E0B;--tile:#0F1D3A;--red:#F87171;--green:#6EE7A8;--accent:#F59E0B;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--spring:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(34,211,238,.12),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(245,158,11,.10),transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3,.num{font-family:var(--display)}
.hidden{display:none!important}

/* boutons et champs */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-weight:600;transition:transform .12s var(--spring),background .15s,box-shadow .15s,border-color .15s}
.btn:hover:not(:disabled){background:#1B3564;border-color:#34558F;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,#FCC14A,#F59E0B);border-color:#F59E0B;color:#1A1204;box-shadow:0 3px 0 #A96500,0 10px 24px rgba(245,158,11,.22)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#FFD06A,#FBAA1C);border-color:#FBAA1C}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #A96500}
.btn.primary::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);translate:-110% 0;pointer-events:none}
.btn.primary:hover:not(:disabled)::after{translate:110% 0;transition:translate .65s ease}
.btn.cta{animation:cta 1.8s ease-in-out infinite}
@keyframes cta{0%,100%{box-shadow:0 3px 0 #A96500,0 0 0 0 rgba(245,158,11,.55)}50%{box-shadow:0 3px 0 #A96500,0 0 0 12px rgba(245,158,11,0)}}
.btn.cyan{background:linear-gradient(180deg,#5EE6F7,#22D3EE);border-color:var(--cyan);color:#04222A;box-shadow:0 3px 0 #0B7E90}
.btn.danger{border-color:#7F2D2D;color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.field{width:100%;background:#0A1730;border:1px solid var(--line);border-radius:11px;padding:11px 14px;transition:border-color .15s,box-shadow .15s}
.field:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.field::placeholder{color:#5F7399}
label.lbl{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}

/* fond animé de l'accueil */
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgfx span{position:absolute;left:var(--x);top:105%;width:var(--w);aspect-ratio:1/1.35;border-radius:calc(var(--w)*.12);background:linear-gradient(180deg,var(--g) 0 26%,#12234A 26%);opacity:.22;rotate:var(--r);animation:drift var(--d) linear infinite;animation-delay:var(--dl);box-shadow:0 20px 40px rgba(0,0,0,.35)}
@keyframes drift{to{transform:translateY(-135vh) rotate(50deg)}}

/* écrans d'accueil */
.shell{min-height:100%;display:grid;place-items:center;padding:24px;position:relative;z-index:1}
.card{width:min(100%,460px);background:linear-gradient(180deg,rgba(21,40,77,.92),rgba(14,27,54,.94));border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.03) inset;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.intro{animation:cardin .7s var(--spring) both}
.card.intro .stack>*{animation:rise .5s ease-out both}
.card.intro .stack>*:nth-child(1){animation-delay:.25s}.card.intro .stack>*:nth-child(2){animation-delay:.3s}.card.intro .stack>*:nth-child(3){animation-delay:.35s}.card.intro .stack>*:nth-child(4){animation-delay:.4s}.card.intro .stack>*:nth-child(n+5){animation-delay:.45s}
@keyframes cardin{from{opacity:0;transform:translateY(30px) scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card.wide{width:min(100%,1000px)}
.logo{font:800 clamp(46px,9vw,72px)/.95 var(--display);letter-spacing:-.035em;display:flex;align-items:flex-end;gap:.12em}
.logo i{font-style:normal;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:.66em;height:.66em;padding:.09em;border-radius:.15em;background:linear-gradient(145deg,#FFD06A,#F59E0B);margin-bottom:.12em;rotate:12deg;box-shadow:.14em .1em 0 var(--cyan),0 .2em .5em rgba(0,0,0,.4)}
.logo i b{border-radius:50%;background:#1A1204;margin:14%}
.logo i b:nth-child(2),.logo i b:nth-child(4),.logo i b:nth-child(6),.logo i b:nth-child(8){visibility:hidden}
.intro .logo i{animation:tumble 1s var(--spring) .1s both}
@keyframes tumble{from{transform:translate(1.2em,-1.6em) rotate(-300deg);opacity:0}}
.tag{color:var(--mute);margin:12px 0 24px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.row>.field{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:20px 0}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--red);font-size:13px;min-height:18px}
.shake{animation:shakex .4s}
@keyframes shakex{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* salon */
.lobby{display:grid;grid-template-columns:1fr 1.3fr;gap:30px}
.code{font:800 42px/1 var(--display);letter-spacing:.12em;background:linear-gradient(180deg,#FFD06A,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent}
.plist{display:grid;gap:8px;margin-top:10px}
.pl{display:flex;align-items:center;gap:10px;background:#0A1730;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.pl.new{animation:slidein .45s var(--spring)}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}}
.nmin{flex:1;min-width:0;background:transparent;border:1px dashed transparent;border-radius:8px;padding:4px 6px;margin:-4px 0;font-weight:700;font-size:15px}
.nmin:hover{border-color:var(--line)}
.nmin:focus{outline:0;border:1px solid var(--cyan);background:#07101F}
.pen{font-size:12px;opacity:.55;margin-left:-4px}
.btn.off{opacity:.6}
.pl .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#fff 0 8%,color-mix(in srgb,var(--c) 70%,#fff) 9% 24%,var(--c) 48%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 6px rgba(0,0,0,.5)}
button.dot{width:24px;height:24px;transition:transform .2s var(--spring)}
button.dot:hover:not(:disabled){transform:scale(1.2) rotate(20deg)}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.badge.warn{background:#3A1E1E;color:var(--red)}
.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.map{text-align:left;background:#0A1730;border:1px solid var(--line);border-radius:13px;padding:12px 12px 10px;position:relative;overflow:hidden;transition:transform .18s var(--spring),border-color .15s,box-shadow .15s}
.map:hover:not(:disabled){transform:translateY(-2px);border-color:var(--a)}
.map.on{background:color-mix(in srgb,var(--a) 12%,#0A1730);border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 8px 24px color-mix(in srgb,var(--a) 25%,transparent)}
.map.on::after{content:'✓';position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--a);color:#07101F;font-weight:800;font-size:12px;display:grid;place-items:center;animation:pop .3s var(--spring)}
.map b{font-family:var(--display);font-size:17px;display:block}
.map span{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map em{display:flex;gap:2px;margin-top:8px;height:5px;border-radius:9px;overflow:hidden}
.map em u{flex:1;background:var(--g)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 26px}
.sel{width:auto;padding:6px 8px;font-size:13.5px;flex:none;max-width:118px}
.tbar{width:min(60%,260px);height:4px;border-radius:9px;background:rgba(10,23,48,.9);overflow:hidden;margin:.5cqw 0 0}
.tbar:empty{display:none}
.tbar i{display:block;height:100%;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{0%{transform:scaleX(1);background:var(--cyan)}60%{background:var(--amber)}100%{transform:scaleX(0);background:var(--red)}}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;font-size:14px}
.opt small{display:block;color:var(--mute);font-size:12px}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:#0A1730;border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--mute);transition:transform .25s var(--spring),background .15s}
.sw:checked{background:#0E4D5A;border-color:var(--cyan)}
.sw:checked::after{transform:translateX(17px);background:var(--cyan)}
.sw:disabled{opacity:.6;cursor:default}
h3.sec{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600}
h3.sec:first-child{margin-top:0}

/* jeu */
body:has(.game){background-image:radial-gradient(1100px 700px at 30% 40%,rgba(40,70,140,.22),transparent 65%),radial-gradient(700px 500px at 100% 0%,rgba(34,211,238,.10),transparent 60%),radial-gradient(circle,rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:auto,auto,22px 22px}
.game{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;height:100dvh;padding:8px 12px;position:relative;z-index:1}
.boardwrap{display:grid;place-items:center;min-width:0;min-height:0}
.boardbox{container-type:inline-size;width:min(100%,calc(100dvh - 16px));aspect-ratio:1;position:relative}
.board{width:100%;height:100%;display:grid;position:relative;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;gap:.42cqw;padding:.75cqw;border-radius:2.2cqw;
  background:linear-gradient(145deg,#1A2E5A,#0B1630 45%,#12224A);
  box-shadow:0 0 0 .18cqw #2F4F8C,0 0 0 .55cqw #0C1833,0 0 0 .7cqw color-mix(in srgb,var(--accent) 55%,#1B3159),0 0 9cqw color-mix(in srgb,var(--accent) 22%,transparent),0 3cqw 7cqw rgba(0,0,0,.55)}
.board.enter .tile{animation:tilein .5s var(--spring) both;animation-delay:calc(var(--n)*14ms)}
@keyframes tilein{from{opacity:0;transform:scale(.4)}}

/* cases */
.tile{--tb:#16294F;display:flex;min-width:0;min-height:0;overflow:hidden;position:relative;padding:0;color:var(--text);text-align:center;font-size:1.36cqw;line-height:1.1;border-radius:.95cqw;
  background:linear-gradient(165deg,color-mix(in srgb,var(--tb) 100%,#fff 0%),#0E1B38);box-shadow:inset 0 .13cqw 0 rgba(255,255,255,.12),inset 0 0 0 .1cqw rgba(255,255,255,.05),0 .3cqw .7cqw rgba(0,0,0,.4);
  transition:transform .18s var(--spring),filter .15s,box-shadow .2s}
.tile:hover{filter:brightness(1.22);transform:scale(1.06);z-index:3}
.tile.sb{flex-direction:column}.tile.st{flex-direction:column-reverse}.tile.sl{flex-direction:row-reverse}.tile.sr{flex-direction:row}
.tile.k-prop{--tb:color-mix(in srgb,var(--g) 20%,#16294F)}
.band{flex:none;display:flex;align-items:center;justify-content:center;gap:.22cqw;position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--g) 82%,#fff),var(--g) 55%,color-mix(in srgb,var(--g) 74%,#000));box-shadow:inset 0 .16cqw 0 rgba(255,255,255,.45),0 .2cqw .5cqw rgba(0,0,0,.35)}
.sb .band,.st .band{height:24%;width:100%}.sl .band,.sr .band{width:20%;height:100%;flex-direction:column}
.hs{width:1.05cqw;height:1.05cqw;background:linear-gradient(180deg,#4ADE80,#0B7A4B);border:.13cqw solid #fff;border-radius:.22cqw;box-shadow:0 .1cqw .25cqw rgba(0,0,0,.55)}
.hs.hotel{width:2.1cqw;background:linear-gradient(180deg,#F87171,#9B1C1C)}
.sl .hs.hotel,.sr .hs.hotel{width:1.05cqw;height:2.1cqw}
.hs.built{animation:built .55s var(--spring)}
@keyframes built{from{transform:translateY(-250%) scale(.2) rotate(-90deg);opacity:0}}
.inf{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:.45cqw .3cqw .4cqw;min-width:0;min-height:0;gap:.15cqw}
.inf .nm{font-weight:700;overflow-wrap:break-word;hyphens:auto;max-width:100%;text-shadow:0 .1cqw .2cqw rgba(0,0,0,.5)}
.inf .nm.long{font-size:.84em;letter-spacing:-.025em}
.sb .nm.xlong,.st .nm.xlong{font-size:.7em;letter-spacing:-.03em}
.sl .nm.xlong,.sr .nm.xlong{font-size:.86em}
.inf .ic{font-size:2.2cqw;line-height:1;width:3.5cqw;height:3.5cqw;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.05));box-shadow:inset 0 0 0 .1cqw rgba(255,255,255,.14)}
.sl .inf,.sr .inf{justify-content:center;gap:.3cqw}
.sl.k-rail .inf,.sr.k-rail .inf,.sl.k-util .inf,.sr.k-util .inf,.sl.k-chance .inf,.sr.k-chance .inf,.sl.k-chest .inf,.sr.k-chest .inf,.sl.k-tax .inf,.sr.k-tax .inf{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;align-items:center;justify-items:center;gap:0 .4cqw;padding:.4cqw .6cqw}
.sl .inf .ic,.sr .inf .ic{grid-row:1/3}
.inf .pr{font-family:var(--display);font-weight:800;color:#B9C8E6;font-size:1.22cqw;border-radius:99px;padding:.12cqw .7cqw;background:rgba(5,12,28,.55);transition:background .3s,color .3s;white-space:nowrap}
.tile.k-chance{--tb:#4A3413}.tile.k-chest{--tb:#0F3F4D}.tile.k-tax{--tb:#4A1B2C}.tile.k-rail{--tb:#2A3550}.tile.k-util{--tb:#443C16}
.tile.owned{background:linear-gradient(165deg,color-mix(in srgb,var(--o) 34%,#16294F),color-mix(in srgb,var(--o) 14%,#0E1B38));box-shadow:inset 0 0 0 .2cqw var(--o),0 0 1.4cqw color-mix(in srgb,var(--o) 45%,transparent),0 .3cqw .7cqw rgba(0,0,0,.4)}
.tile.owned .pr{background:var(--o);color:#07101F}
.tile.mort{background:repeating-linear-gradient(45deg,#16294F 0 .8cqw,#0A1529 .8cqw 1.6cqw);box-shadow:inset 0 0 0 .2cqw color-mix(in srgb,var(--o) 50%,#000)}
.tile.mort .nm{opacity:.5;text-decoration:line-through}.tile.mort .band{filter:grayscale(.8) brightness(.7)}
.tile.corner{border-radius:1.6cqw}
.tile.corner .inf{justify-content:center;gap:.35cqw}
.tile.corner .ic{font-size:3.6cqw;width:5.6cqw;height:5.6cqw;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.4),rgba(255,255,255,.1));box-shadow:inset 0 0 0 .14cqw rgba(255,255,255,.3),0 .4cqw 1cqw rgba(0,0,0,.3)}
.tile.corner .nm{font-family:var(--display);font-weight:800;font-size:1.55cqw;letter-spacing:-.01em}
.tile.corner .sub{font:800 1.25cqw var(--display);background:rgba(5,12,28,.5);border-radius:99px;padding:.1cqw .7cqw;min-height:0}
.tile.corner .sub:empty{display:none}
.tile.k-go{background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 95%,#fff),color-mix(in srgb,var(--accent) 60%,#1B0F00));color:#fff}
.tile.k-jail{background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 5%,transparent 5% 16%),linear-gradient(150deg,#FB923C,#9A3412)}
.tile.k-park{background:linear-gradient(150deg,#2DD4BF,#0E6B7E)}
.tile.k-gojail{background:linear-gradient(150deg,#818CF8,#3730A3)}
.tile.here{z-index:2;animation:here 1.3s ease-in-out infinite}
@keyframes here{0%,100%{box-shadow:inset 0 0 0 .3cqw var(--hc,var(--cyan)),0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 .3cqw var(--hc,var(--cyan)),0 0 2.4cqw color-mix(in srgb,var(--hc,var(--cyan)) 75%,transparent)}}
.tile.bought{animation:bought 1.1s ease-out;z-index:3}
@keyframes bought{0%{box-shadow:inset 0 0 0 9cqw var(--o);filter:brightness(2);transform:scale(1.25)}35%{filter:brightness(1.4)}100%{box-shadow:inset 0 0 0 .2cqw var(--o);filter:none;transform:none}}
.tile.landed{animation:landed .5s ease-out}
@keyframes landed{0%{filter:brightness(2.1);transform:scale(1.1)}100%{filter:none;transform:none}}

/* centre du plateau */
.center{grid-column:2/11;grid-row:2/11;border-radius:1.6cqw;background:#081226;display:flex;flex-direction:column;align-items:center;padding:2cqw 2.6cqw 1.6cqw;min-height:0;position:relative;overflow:hidden;overflow:clip;isolation:isolate;
  box-shadow:inset 0 0 0 .12cqw rgba(255,255,255,.07),inset 0 0 8cqw rgba(0,0,0,.6)}
.center::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.5;background:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:2.2cqw 2.2cqw;-webkit-mask:radial-gradient(circle at 50% 35%,#000,transparent 75%);mask:radial-gradient(circle at 50% 35%,#000,transparent 75%)}
.center .glow{position:absolute;left:50%;top:20%;width:95%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:-2;opacity:.55;filter:blur(44px);
  background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 75%,transparent),transparent 25%,rgba(34,211,238,.5) 50%,transparent 75%,color-mix(in srgb,var(--accent) 75%,transparent));animation:rot 26s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.center .wm{display:none}
.center h1{font-size:clamp(20px,4.6cqw,46px);font-weight:800;letter-spacing:-.035em;line-height:1;text-align:center;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--accent) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .3cqw .8cqw rgba(0,0,0,.5))}
.center h1 small{display:block;font:600 clamp(10px,1.45cqw,14px)/1.4 var(--body);color:var(--mute);-webkit-text-fill-color:var(--mute);letter-spacing:0;margin-top:.4cqw}
.center h1 small b{color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:800}

/* pioches et cagnotte */
.decks{display:flex;align-items:center;justify-content:center;gap:3.2cqw;width:100%;margin:.4cqw 0 1.4cqw}
.deck{--k:#F59E0B;--k2:#B45309;position:relative;width:11cqw;height:7.2cqw;rotate:-5deg;flex:none}
.deck.d-chest{--k:#22D3EE;--k2:#0E7490;rotate:5deg}
.deck i,.deck b{position:absolute;inset:0;border-radius:.9cqw;background:linear-gradient(150deg,var(--k),var(--k2));box-shadow:0 .25cqw .6cqw rgba(0,0,0,.45),inset 0 0 0 .14cqw rgba(255,255,255,.55)}
.deck i:nth-child(1){translate:.55cqw .6cqw;filter:brightness(.6)}.deck i:nth-child(2){translate:.28cqw .3cqw;filter:brightness(.8)}
.deck b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;color:#fff;font:800 1.25cqw var(--display);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 .5cqw,transparent .5cqw 1cqw),linear-gradient(150deg,var(--k),var(--k2))}
.deck b span{font-size:2.5cqw;line-height:1;filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.4))}
.deck.draw b{animation:drawcard .7s ease-out}
@keyframes drawcard{35%{transform:translateY(-70%) rotate(8deg) scale(1.12)}100%{transform:none}}
.potbox{min-width:13cqw;text-align:center;line-height:1.15}
.potbox small{display:block;font-size:clamp(9px,1.2cqw,12px);color:var(--mute);font-weight:600}
.potbox b{font:800 clamp(14px,2.5cqw,24px) var(--display);color:#5EEAD4}

/* dés 3D */
.dice{display:flex;gap:2.6cqw;margin:4.2cqw 0 1.8cqw;--s:clamp(34px,6.4cqw,58px)}
.die3d{width:var(--s);height:var(--s);perspective:calc(var(--s)*6);position:relative}
.die3d::after{content:'';position:absolute;left:8%;right:8%;bottom:-32%;height:22%;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(5px)}
.die3d.toss{animation:toss .95s cubic-bezier(.3,.7,.4,1)}
.die3d.toss::after{animation:tossshadow .95s cubic-bezier(.3,.7,.4,1)}
@keyframes toss{0%{transform:translateY(0)}30%{transform:translateY(-95%)}62%{transform:translateY(0)}76%{transform:translateY(-22%)}100%{transform:none}}
@keyframes tossshadow{0%,62%,100%{transform:scale(1);opacity:1}30%{transform:scale(.5);opacity:.4}76%{transform:scale(.85);opacity:.8}}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.75,.25,1)}
.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#DCE4F2);border-radius:16%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:inset 0 0 0 1px #B9C6DD,inset 0 0 calc(var(--s)*.18) rgba(11,23,48,.18);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face b{border-radius:50%;background:radial-gradient(circle at 35% 30%,#2B3B5E,#0B1730);margin:10%}
.f1 b{background:radial-gradient(circle at 35% 30%,#F87171,#B91C1C);margin:-6%}
.f1{transform:translateZ(calc(var(--s)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.dsum{font:800 clamp(13px,1.9cqw,18px) var(--display);color:var(--mute);align-self:center;min-width:2.2em;text-align:center}
.dsum.dbl{color:var(--amber)}

.status{font-weight:600;text-align:center;min-height:1.5em}
.status .who{color:var(--c)}
.dots::after{content:'';animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:1cqw 0;min-height:44px;align-items:center}
.actions>*{animation:pop .3s var(--spring) both}
.actions>*:nth-child(2){animation-delay:.05s}.actions>*:nth-child(3){animation-delay:.1s}
@keyframes pop{from{scale:.7;opacity:0}}
.warnbox{width:100%;text-align:center;color:var(--red);font-size:13px}
/* enchères : grande carte au centre du plateau */
.center>#auction:not(:empty){position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:2cqw;background:radial-gradient(circle,rgba(3,8,20,.86),rgba(3,8,20,.96));animation:fade .25s}
.auc{width:min(100%,520px)}
.auc-card{position:relative;border-radius:20px;padding:16px 18px 14px;background:linear-gradient(175deg,#1B305E,#0D1A36);border:1px solid #38598F;box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 60px rgba(245,158,11,.18),0 30px 70px rgba(0,0,0,.6)}
.auc-card.fresh{animation:pop .35s var(--spring)}
.auc-hist:empty{display:none}
.auc-card::before{content:'';position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.auc-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.auc-prop{display:flex;align-items:stretch;gap:10px;min-width:0;text-align:left}
.auc-prop u{width:12px;border-radius:5px;background:linear-gradient(180deg,color-mix(in srgb,var(--g) 85%,#fff),var(--g),color-mix(in srgb,var(--g) 72%,#000));box-shadow:0 0 14px color-mix(in srgb,var(--g) 60%,transparent);flex:none}
.auc-prop small{display:block;font-size:12px;color:var(--amber);font-weight:700}
.auc-prop b{display:block;font:800 clamp(18px,2.8cqw,26px)/1.05 var(--display);letter-spacing:-.02em}
.auc-prop span{font-size:12.5px;color:var(--mute)}
.ring{width:54px;height:54px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#0A1730;stroke-width:4}
.ring .rg{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:100.6;animation:ringdown linear forwards}
.ring text{font-size:15px;transform:rotate(90deg);transform-origin:20px 20px}
@keyframes ringdown{0%{stroke-dashoffset:0;stroke:var(--cyan)}60%{stroke:var(--amber)}100%{stroke-dashoffset:100.6;stroke:var(--red)}}
.gavel{font-size:30px;display:inline-block;animation:gavel 1.2s ease-in-out infinite;transform-origin:80% 80%}
@keyframes gavel{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-28deg)}}
.auc-price{text-align:center;margin:10px 0 8px}
.auc-price .num{display:inline-block;font:800 clamp(34px,6.4cqw,58px)/1 var(--display);letter-spacing:-.03em;background:linear-gradient(180deg,#FFE29A,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(245,158,11,.35))}
.auc-price .num.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1.55) rotate(-4deg);filter:drop-shadow(0 0 30px rgba(255,226,154,.9))}}
.auc-price small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.auc-hist{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.hb{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#0A1730;border:1px solid var(--line);color:var(--mute);border-left:3px solid var(--c)}
.hb b{color:var(--text);font-family:var(--display)}
.hb.last{animation:slidein .35s var(--spring);border-color:var(--c);color:var(--text)}
.seats{display:flex;justify-content:center;gap:12px;margin:4px 0 12px}
.seat{position:relative;display:grid;justify-items:center;gap:3px;transition:opacity .3s,filter .3s}
.seat small{font-size:10.5px;color:var(--mute);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.out{opacity:.3;filter:grayscale(1)}
.seat.out .ava::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:2.5px;background:var(--red);rotate:-35deg}
.seat.lead .ava{box-shadow:0 0 0 3px var(--amber),0 0 18px rgba(245,158,11,.6)}
.seat em{position:absolute;top:-13px;font-style:normal;font-size:14px;animation:crown 1.6s ease-in-out infinite}
.ava.sm{width:30px;height:30px;font-size:13px;grid-row:auto;position:relative}
.bidrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);font-size:13px}
.bidrow+.bidrow{margin-top:8px}
.bidrow .who{font-weight:800;color:var(--c);width:100%;text-align:center}
.bidrow .note{width:100%;text-align:center;font-size:12px}
.bidrow .lead-note{color:var(--amber);font-weight:700}
.btn.bid{background:linear-gradient(180deg,#FCC14A,#F59E0B);border-color:#F59E0B;color:#1A1204;font-family:var(--display);font-weight:800;padding:6px 14px;line-height:1.1;box-shadow:0 3px 0 #A96500;border-radius:11px}
.btn.bid:hover:not(:disabled){background:linear-gradient(180deg,#FFD06A,#FBAA1C);border-color:#FBAA1C}
.btn.bid:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #A96500}
.btn.bid small{display:block;font:700 10px var(--body);opacity:.7}
.bidcustom{display:flex}
.bidcustom input{width:112px;background:#0A1730;border:1px solid var(--line);border-right:0;border-radius:11px 0 0 11px;padding:0 10px;font:700 14px var(--display);-moz-appearance:textfield}
.bidcustom input::-webkit-outer-spin-button,.bidcustom input::-webkit-inner-spin-button{-webkit-appearance:none}
.bidcustom input:focus{outline:0;border-color:var(--amber)}
.bidcustom .btn{border-radius:0 11px 11px 0;padding:9px 12px}
.dock .auc{width:100%;margin-bottom:8px}
.turnfx.sold span{font-size:clamp(16px,3.6cqw,34px)}

/* dette à rembourser */
.debt{width:100%;text-align:left;background:linear-gradient(175deg,#3A1518,#1E0D12);border:1px solid #8B2C33;border-radius:16px;padding:12px 14px;box-shadow:0 0 40px rgba(248,113,113,.15);animation:pop .35s var(--spring)}
.debt-hd{display:flex;gap:10px;align-items:flex-start}
.debt-ic{font-size:24px;animation:crown 1.2s ease-in-out infinite}
.debt-hd b{font-family:var(--display);font-size:16px}
.debt-hd small{display:block;color:#F3B6B6;font-size:12.5px;margin-top:2px}
.debt-bar{position:relative;height:18px;border-radius:99px;background:#16090C;margin:10px 0;overflow:hidden}
.debt-bar i{position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,#B45309,#F59E0B);border-radius:99px;transition:width .4s}
.debt-bar span{position:relative;display:block;text-align:center;font:700 11px/18px var(--body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.debt-opts{display:flex;flex-wrap:wrap;gap:6px;max-height:min(17cqw,112px);overflow-y:auto;margin-bottom:10px;scrollbar-width:thin}
.debt-opts .btn{background:#0A1730;border-left:4px solid var(--g);text-align:left;line-height:1.15;font-size:12.5px}
.debt-opts .btn small{display:block;color:var(--green);font:800 12px var(--display)}

/* carte tirée : vraie carte à jouer, retournement 3D + halo */
.cardpop{--k:#F59E0B;--k2:#B45309;position:absolute;inset:0;overflow:hidden;overflow:clip;display:grid;place-items:center;z-index:6;perspective:1100px;pointer-events:none;background:radial-gradient(circle,rgba(3,8,20,.55),rgba(3,8,20,.8));animation:cardfade 4s forwards}
.cardpop.k-chest{--k:#22D3EE;--k2:#0E7490}
.rays{position:absolute;width:120%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--k) 38%,transparent) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 58%);mask:radial-gradient(circle,#000 8%,transparent 58%);animation:rot 14s linear infinite,raysin 1.2s ease-out .55s both}
@keyframes raysin{from{opacity:0;scale:.3}}
.flip{width:min(58%,270px);aspect-ratio:.7;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:flip 1.05s cubic-bezier(.2,.8,.2,1) both}
.flip>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7%/5%;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.12)}
.cback{transform:rotateY(180deg);background:linear-gradient(150deg,var(--k),var(--k2));padding:5%}
.cback-in{height:100%;border-radius:6%/4%;border:2px solid rgba(255,255,255,.75);display:grid;place-items:center;align-content:center;gap:8%;color:#fff;font:800 clamp(14px,2.6cqw,22px) var(--display);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 8px,transparent 8px 16px),repeating-linear-gradient(-45deg,rgba(255,255,255,.10) 0 8px,transparent 8px 16px)}
.medal{width:46%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(28px,6cqw,56px);box-shadow:0 0 0 6px rgba(255,255,255,.3),0 10px 24px rgba(0,0,0,.35)}
.cfront{background:linear-gradient(170deg,#FFFFFF,#E8EEF8);color:#0B1730;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:12% 9%;text-align:center;overflow:hidden}
.cfront::before{content:'';position:absolute;inset:4%;border:2px solid var(--k);border-radius:5%/3.5%;opacity:.55;pointer-events:none}
.cfront::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);translate:-120% 0;animation:sheen 1s ease-out 1.05s forwards;pointer-events:none}
@keyframes sheen{to{translate:120% 0}}
.cfront .corner{position:absolute;font-size:clamp(12px,2.2cqw,18px);line-height:1}
.cfront .corner.tl{top:7%;left:8%}.cfront .corner.br{bottom:7%;right:8%;rotate:180deg}
.cfront small{font:800 clamp(11px,1.7cqw,14px) var(--display);color:var(--k2);letter-spacing:.02em}
.cicon{width:38%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(24px,5cqw,46px);background:radial-gradient(circle at 35% 30%,#fff,color-mix(in srgb,var(--k) 28%,#fff));box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 45%,#fff),0 8px 18px rgba(11,23,48,.18);animation:pop .5s var(--spring) 1s both}
.cfront p{font-weight:700;font-size:clamp(12px,1.85cqw,16px);line-height:1.3;text-wrap:balance}
.amt{font:800 clamp(14px,2.4cqw,21px) var(--display);padding:.12em .7em;border-radius:99px;animation:pop .45s var(--spring) 1.25s both}
.amt.up{background:#D7F7E6;color:#08734A}.amt.down{background:#FDE1E1;color:#B42323}
.cfront em{font-style:normal;font-size:clamp(10px,1.4cqw,12px);font-weight:700;color:#5B6B8A;display:flex;align-items:center;gap:6px}
.cfront em .dot{width:10px;height:10px;box-shadow:none}
@keyframes flip{0%{transform:translateY(140%) rotateY(180deg) rotateZ(-14deg) scale(.4)}40%{transform:translateY(0) rotateY(180deg) rotateZ(0) scale(1)}55%{transform:rotateY(180deg) scale(1.04)}100%{transform:rotateY(0) scale(1)}}
@keyframes cardfade{0%{opacity:0}5%,90%{opacity:1}100%{opacity:0}}

/* bandeau "à toi de jouer" */
.turnfx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:7;overflow:hidden;overflow:clip}
.turnfx span{font:800 clamp(22px,5.6cqw,52px) var(--display);letter-spacing:-.02em;color:#07101F;background:var(--c);padding:.18em 1.4em;transform:skewX(-8deg);white-space:nowrap;box-shadow:0 0 0 .5cqw rgba(255,255,255,.18),0 0 60px var(--c);animation:sweep 1.5s cubic-bezier(.2,.9,.2,1) both}
@keyframes sweep{0%{translate:-130% 0;opacity:0}22%{translate:0 0;opacity:1}72%{translate:0 0;opacity:1}100%{translate:130% 0;opacity:0}}

.feed{flex:1;width:100%;min-height:3.4em;overflow-y:auto;font-size:13px;line-height:1.45;padding:8px 10px;background:rgba(10,23,48,.72);border:1px solid var(--line);border-radius:12px 12px 0 0;scrollbar-width:thin;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.feed p+p{margin-top:3px}
.feed p.new{animation:logline .35s ease-out}
@keyframes logline{from{opacity:0;transform:translateX(-10px)}}
.feed .who{font-weight:700;color:var(--c)}
.feed .sys{color:var(--mute)}
.feed .chat{color:#fff;background:rgba(34,211,238,.08);border-radius:6px;padding:1px 6px;margin-left:-6px}
.feed .crd{color:#C9D6EE;font-style:italic}
.chatin{width:100%;display:flex}
.chatin input{flex:1;min-width:0;background:#0A1730;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:8px 12px;font-size:13px}
.chatin input:focus{outline:0;border-color:var(--cyan)}

/* pions et effets */
.tokens{position:absolute;inset:0;pointer-events:none;z-index:4}
.tok{position:absolute;width:3.5cqw;height:3.5cqw;min-width:14px;min-height:14px;translate:-50% -50%;transition:left .15s ease-out,top .15s ease-out}
.tok i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:.3cqw solid #fff;box-shadow:0 .45cqw .7cqw rgba(0,0,0,.65),inset 0 -.3cqw .5cqw rgba(0,0,0,.25);font:800 1.55cqw/1 var(--display);font-style:normal;color:rgba(7,16,31,.85);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 7%,color-mix(in srgb,var(--c) 65%,#fff) 8% 26%,var(--c) 52%,color-mix(in srgb,var(--c) 60%,#000) 100%)}
.tok i.hop{animation:hop .15s ease-out}
@keyframes hop{50%{transform:translateY(-60%) scale(1.2)}}
.tok.land i{animation:land .4s ease-out}
@keyframes land{0%{transform:scale(1.3,.7)}45%{transform:scale(.88,1.14)}100%{transform:none}}
.tok.turn{z-index:2}
.tok.turn::after{content:'';position:absolute;inset:-.4cqw;border-radius:50%;border:.26cqw solid var(--c);animation:ring 1.5s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.95}to{transform:scale(1.9);opacity:0}}
.tok.jail i{border-style:dashed;border-color:#111;filter:saturate(.5)}
.fl{position:absolute;translate:-50% -130%;font:800 clamp(11px,1.9cqw,18px) var(--display);padding:.15em .7em;border-radius:99px;white-space:nowrap;z-index:5;animation:floatup 1.7s ease-out both}
.fl.up{background:#0B3324;color:var(--green);border:1px solid #1F7A53;box-shadow:0 0 18px rgba(110,231,168,.35)}
.fl.down{background:#3A1518;color:#FCA5A5;border:1px solid #8B2C33;box-shadow:0 0 18px rgba(248,113,113,.3)}
@keyframes floatup{0%{opacity:0;transform:translateY(60%) scale(.6)}14%{opacity:1;transform:translateY(0) scale(1.12)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-170%)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* panneau latéral */
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.box{background:linear-gradient(180deg,#112142,var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px}
.box h2{font-size:14px;color:var(--mute);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.box h2 .row{gap:6px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:12px;border:1.5px solid transparent;transition:opacity .4s}
.pcard+.pcard{margin-top:4px}
.pcard.turn{--ang:0deg;background:linear-gradient(#0A1730,#0A1730) padding-box,conic-gradient(from var(--ang),var(--c),transparent 30%,transparent 60%,var(--c)) border-box;animation:angspin 3s linear infinite;box-shadow:0 0 24px color-mix(in srgb,var(--c) 18%,transparent)}
@keyframes angspin{to{--ang:360deg}}
.pcard.out{opacity:.35;filter:grayscale(1)}
.pcard .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;grid-row:1/3;align-self:start;font:800 15px var(--display);color:rgba(7,16,31,.85);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.5);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 7%,color-mix(in srgb,var(--c) 65%,#fff) 8% 26%,var(--c) 52%,color-mix(in srgb,var(--c) 60%,#000) 100%)}
.pcard.turn .ava{animation:avap 1.5s ease-in-out infinite}
@keyframes avap{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent),0 3px 8px rgba(0,0,0,.5)}}
.owndots{display:flex;flex-wrap:wrap;gap:3px;align-items:center;width:100%}
.owndots u{width:11px;height:11px;border-radius:3px;background:var(--g);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.owndots u.m{opacity:.35}
.pcard .cash{font:800 17px var(--display);font-variant-numeric:tabular-nums}
.pcard .cash.neg{color:var(--red)}
.pcard .cash.gain{animation:gain .7s ease-out}.pcard .cash.loss{animation:loss .7s ease-out}
@keyframes gain{0%{color:var(--green);transform:scale(1.25)}}
@keyframes loss{0%{color:var(--red);transform:scale(1.25)}}
.pcard .meta{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pcard .meta .btn{padding:3px 10px;font-size:12px;border-radius:99px}
.pcard .meta .btn.danger{border-color:transparent;background:transparent;opacity:.75}
.pcard .meta .btn.danger:hover{opacity:1;background:#3A1518}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini{display:flex;flex-direction:column;min-width:0;border-radius:9px;overflow:hidden;background:linear-gradient(175deg,#FFFFFF,#E4EBF6);color:#0B1730;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .18s var(--spring),box-shadow .18s}
.mini:hover{transform:translateY(-4px) rotate(-1.5deg);box-shadow:0 10px 20px rgba(0,0,0,.45)}
.mini u{text-decoration:none;height:17px;background:linear-gradient(180deg,var(--g),color-mix(in srgb,var(--g) 78%,#000));display:flex;align-items:center;justify-content:center;gap:2px;font-size:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.mini u .hs{width:7px;height:7px;border-width:1px;border-radius:2px}.mini u .hs.hotel{width:14px}
.mini span{font-size:10.5px;font-weight:700;line-height:1.15;padding:5px 3px 1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.45em}
.mini b{font:800 11px var(--display);color:#3B4C70;padding:0 0 5px}
.mini.m{filter:grayscale(1);opacity:.55}
.trade{background:#0A1730;border:1px solid var(--cyan);border-radius:12px;padding:10px;font-size:13px;animation:pop .35s var(--spring);box-shadow:0 0 20px rgba(34,211,238,.12)}
.trade+.trade{margin-top:6px}
.trade .ex{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;margin:6px 0;color:#C9D6EE}

/* modales */
.modal{position:fixed;inset:0;background:rgba(3,8,20,.72);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,380px);max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.fresh .sheet{animation:sheetin .35s var(--spring)}
.modal:has(.deed){perspective:1200px}
.deed{--rx:0deg;--ry:0deg;--mx:50%;--my:0%;width:min(100%,340px);max-height:94dvh;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--spring)}
.deed.tilt{transition:transform .08s linear}
.modal.fresh .deed{animation:deedin .6s var(--spring)}
@keyframes deedin{from{opacity:0;transform:rotateY(-95deg) rotateZ(-6deg) scale(.6)}}
.deed-in{position:relative;border-radius:20px;overflow:hidden;overflow-y:auto;max-height:94dvh;background:linear-gradient(175deg,#FFFFFF,#E6ECF7);color:#0B1730;box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.2),0 0 60px color-mix(in srgb,var(--g) 35%,transparent);padding:9px}
.deed-hd{position:relative;border-radius:13px;padding:16px 16px 18px;text-align:center;color:#07101F;background:linear-gradient(170deg,color-mix(in srgb,var(--g) 85%,#fff),var(--g) 45%,color-mix(in srgb,var(--g) 72%,#000));box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18)}
.deed-hd small{display:block;font:700 11.5px var(--body);opacity:.72;margin-bottom:2px}
.deed-hd b{display:block;font:800 25px/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.dprice{position:absolute;right:10px;bottom:-11px;background:#0B1730;color:#fff;font:800 13px var(--display);padding:3px 10px;border-radius:99px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.dhouses{position:absolute;left:12px;bottom:-8px;display:flex;gap:3px}
.dhouses .hs{width:15px;height:15px;border-width:2px;border-radius:4px;animation:built .5s var(--spring)}.dhouses .hs.hotel{width:32px}
.deed-bd{padding:18px 9px 6px}
.dico{font-size:54px;text-align:center;line-height:1;margin:2px 0 10px;filter:drop-shadow(0 6px 10px rgba(11,23,48,.25))}
.ownr{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:#3B4C70;margin-bottom:12px}
.ownr b{color:#0B1730}.ownr .dot{width:14px;height:14px}
.ownr.free b{background:#D7F7E6;color:#08734A;border-radius:99px;padding:1px 9px;font-family:var(--display)}
.rrs{display:grid;gap:2px}
.rr{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:0 6px;padding:5px 8px 7px;border-radius:9px;font-size:13.5px;position:relative;color:#2A3A5C}
.rr .lv{font-size:11px;letter-spacing:-3px;white-space:nowrap}
.rr b{font:800 14.5px var(--display);color:#0B1730;font-variant-numeric:tabular-nums}
.rr i{grid-column:1/4;height:4px;border-radius:9px;background:#D5DDEC;margin-top:4px;position:relative;overflow:hidden}
.rr i::after{content:'';position:absolute;inset:0;width:var(--w);border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--g) 60%,#fff),var(--g));transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.rr:nth-child(2) i::after{animation-delay:.05s}.rr:nth-child(3) i::after{animation-delay:.1s}.rr:nth-child(4) i::after{animation-delay:.15s}.rr:nth-child(5) i::after{animation-delay:.2s}.rr:nth-child(6) i::after{animation-delay:.25s}
@keyframes grow{from{transform:scaleX(0)}}
.modal:not(.fresh) .rr i::after{animation:none}
.rr.cur{background:#0B1730;color:#C9D6EE;box-shadow:0 6px 16px rgba(11,23,48,.3)}
.rr.cur b{color:#FCC14A}.rr.cur i{background:#22365F}
.rr.cur::before{content:'';position:absolute;left:-9px;top:50%;translate:0 -50%;border:7px solid transparent;border-left-color:var(--g)}
.dtxt{text-align:center;font-weight:600;color:#2A3A5C;padding:4px 10px 12px;text-wrap:balance}
.df{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.df span{background:#DCE4F2;border-radius:10px;padding:6px 8px;font-size:11.5px;color:#3B4C70;text-align:center}
.df b{display:block;font:800 14px var(--display);color:#0B1730}
.deed .mact{margin-top:10px}
.deed .btn{background:#0B1730;border-color:#0B1730;color:#fff;border-radius:11px;padding:8px 10px;font-size:13.5px;line-height:1.2}
.deed .btn:hover:not(:disabled){background:#1B3564;border-color:#1B3564}
.deed .btn small{display:block;font:700 11.5px var(--display);color:#FCC14A}
.deed .btn.wide{grid-column:1/-1}
.deed .btn.ghost{width:100%;margin-top:8px;background:transparent;border-color:#C3CEE2;color:#3B4C70}
.deed .btn.ghost:hover{background:#DCE4F2;border-color:#C3CEE2}
.stamp{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-16deg;font:800 30px var(--display);color:#C62828;border:4px solid #C62828;border-radius:10px;padding:2px 14px;opacity:.8;pointer-events:none;mix-blend-mode:multiply;animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampin{from{scale:2.6;opacity:0}}
.is-mort .rrs{opacity:.45}
.glare{position:absolute;inset:0;pointer-events:none;border-radius:20px;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 45%);mix-blend-mode:soft-light}
.deed.tilt .glare{opacity:1}
@keyframes sheetin{from{opacity:0;transform:translateY(24px) scale(.94)}}
.sheet.big{width:min(100%,680px)}
.sheet .hd{background:linear-gradient(180deg,var(--g,var(--panel2)),color-mix(in srgb,var(--g,var(--panel2)) 75%,#000));color:#07101F;padding:18px;font:800 22px var(--display)}
.sheet .hd.dark{color:var(--text)}
.sheet .bd{padding:16px 18px}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt td{padding:5px 0;border-bottom:1px solid var(--line)}
.rt td:last-child{text-align:right;font-family:var(--display);font-weight:700}
.rt tr.cur td{color:var(--amber)}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcols h4{font-family:var(--display);font-size:15px;margin-bottom:8px}
.pick{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--g);margin-top:5px;font-size:13px;cursor:pointer;background:#0A1730;transition:transform .12s var(--spring),background .15s}
.pick:hover:not(.no){transform:translateX(3px)}
.pick.on{background:var(--panel2);border-color:var(--cyan);border-left-color:var(--g)}
.pick.no{opacity:.4;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:22px;translate:-50% 0;background:#F4F7FD;color:#0B1730;font-weight:600;padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastin .35s var(--spring)}
@keyframes toastin{from{transform:translateY(30px);opacity:0}}
.banner{position:fixed;top:0;left:0;right:0;background:#7A2E0E;color:#fff;text-align:center;padding:6px;font-size:13px;z-index:30}
.winner{text-align:center;animation:pop .6s var(--spring)}
.winner .crown{font-size:clamp(34px,7cqw,64px);display:block;animation:crown 1.6s ease-in-out infinite}
@keyframes crown{50%{transform:translateY(-12%) rotate(6deg)}}
.winner .big{font:800 clamp(22px,4.2cqw,40px) var(--display);color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}
.rank{margin:8px auto;font-size:13px;color:var(--mute)}

@media (max-width:980px){
  .game{grid-template-columns:1fr;height:auto;padding:8px}
  .boardbox{width:100%}
  .side{overflow:visible}
  .lobby{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .boardwrap{display:block}
  .dock{margin-top:10px;display:flex;flex-direction:column}
  .dock .feed{height:150px;flex:none}
  .center h1{font-size:22px}.center h1 small{display:none}
  .center{justify-content:center;gap:4px}
  .dice{margin:8px 0 10px}
  .actions .btn{padding:7px 10px;font-size:13px}
  .status{font-size:13px}.warnbox{font-size:11.5px}
  .tile:not(.corner) .nm{display:none}
  .decks{display:none}
  .tile{font-size:1.9cqw}.inf .pr{font-size:1.75cqw;padding:.1cqw .4cqw}.inf .ic{font-size:2.8cqw}
  .sl .inf,.sr .inf{display:flex!important;flex-direction:column}
  .center{padding:2cqw}
  .feed{font-size:11.5px;padding:5px 7px}
  .btn{padding:8px 12px;font-size:14px}
  .tcols{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .card{padding:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- salon ---------- */
function newLobby(code, hostId) {

}
function lobbyAct(S, pid, a) {

      if (P(S, pid)) return null;
      if (S.players.length >= MAX_PLAYERS) return 'Le salon est complet';
      const used = S.players.map(p => p.color);
      S.players.push({ id: pid, name: cleanName(a.name, S), color: PLAYER_COLORS.find(c => !used.includes(c)), bot: false, conn: true });
      return null;
    }
    case 'addPlayer': {
      if (!host) return 'Réservé à l\'hôte';
      if (S.players.length >= MAX_PLAYERS) return 'Le salon est complet';
      const used = S.players.map(p => p.color), bots = ['Rex', 'Nova', 'Pixel', 'Moka', 'Zed', 'Luna'];
      const name = a.bot ? 'Bot ' + bots.find(n => !S.players.some(p => p.name === 'Bot ' + n)) : a.name;
      S.players.push({ id: rid(), name: cleanName(name, S), color: PLAYER_COLORS.find(c => !used.includes(c)), bot: !!a.bot, conn: true, local: !a.bot });
      return null;
    }
    case 'remove': {
      if (!host && a.id !== pid) return 'Réservé à l\'hôte';

      S.players = S.players.filter(p => p.id !== a.id); return null;
    }
    case 'setColor': {
      if (!host && a.id !== pid) return 'Interdit';
      const p = P(S, a.id); if (!p) return 'Joueur inconnu';
      if (!PLAYER_COLORS.includes(a.color) || S.players.some(x => x.color === a.color)) return 'Couleur déjà prise';
      p.color = a.color; return null;
    }
    case 'rename': {
      if (!host && a.id !== pid) return 'Interdit';
      const p = P(S, a.id); if (!p) return 'Joueur inconnu'; if (p.bot) return 'Un bot garde son nom';
      p.name = '\u0000'; p.name = cleanName(a.name, S); return null;
    }
    case 'setMap': if (!host) return 'Réservé à l\'hôte'; if (!MAPS[a.mapId]) return 'Map inconnue'; S.mapId = a.mapId; return null;
    case 'setSetting': {
      if (!host) return 'Réservé à l\'hôte';
      if (!(a.key in DEFAULT_SETTINGS)) return 'Réglage inconnu';
      if (SETTING_CHOICES[a.key]) { const v = parseInt(a.value, 10); if (!SETTING_CHOICES[a.key].includes(v)) return 'Valeur refusée'; S.settings[a.key] = v; return null; }

    }

function cleanName(n, S) {

    decks: { chance: shuffle(CARDS.chance.map((_, i) => i)), chest: shuffle(CARDS.chest.map((c, i) => (c.f === 'potAdd' && !S.settings.pot ? -1 : i)).filter(i => i >= 0)), ci: 0, ti: 0 } });

function credit(S, toId, toPot, amt) { if (toId) { const c = P(S, toId); if (c && !c.bankrupt) c.cash += amt; } else if (toPot && S.settings.pot) S.pot += amt; }

    if (d) d.amt += short; else from.debts.push({ to: toId || null, pot: !!toPot, amt: short });
    log(S, from, 'n\'a pas assez : il doit encore ' + money(S, short) + ' à ' + (toId ? P(S, toId).name : 'la banque') + '.', { s: 'debt' });

    if (!p.debts || !p.debts.length || p.bankrupt) continue;

  };
  modalRoot().innerHTML = `<div class="sheet big" role="dialog" aria-label="Échange"><div class="hd dark">Échange avec ${esc(Z.name)}</div><div class="bd"><div class="tcols">${col(A, 'give', esc(A.name) + ' donne')}${col(Z, 'get', esc(Z.name) + ' donne')}</div>
    <div class="row" style="margin-top:16px"><button class="btn primary" data-a="tr-send" style="flex:1">Proposer l'échange</button><button class="btn" data-a="close">Annuler</button></div></div></div>`;
}

/* ================= ÉVÉNEMENTS ================= */
function readName() { const el = $('#name'); if (el) { net.name = el.value.trim().slice(0, 14) || 'Joueur'; LS.set('magnat_name', net.name); } }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, d = el.dataset;
  if (a !== 'backdrop' && a !== 'snd') sfx('click');
  if (a === 'backdrop') { if (e.target === el) closeModal(); return; }
  switch (a) {
    case 'create': readName(); S = newLobby(newCode(), net.myId); lobbyAct(S, net.myId, { type: 'join', name: net.name }); hostStart(false); save(); render(); break;
    case 'local': readName(); net.mode = 'local'; S = newLobby('LOCAL', 'local-host'); lobbyAct(S, S.hostId, { type: 'addPlayer', name: net.name }); lobbyAct(S, S.hostId, { type: 'addPlayer', bot: true }); save(); render(); break;
    case 'resume': { const sv = LS.get('magnat_save'); if (!sv) return; readName(); S = sv.S; S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings); S.players.forEach(p => { if (!p.bot && !p.local && p.id !== net.myId) p.conn = false; });
      if (sv.mode === 'host') { if (S.hostId !== net.myId) { LS.del('magnat_save'); S = null; return render(); } hostStart(true); } else net.mode = 'local'; changed(); break; }
    case 'discard': LS.del('magnat_save'); render(); break;
    case 'home': goHome(); break;
    case 'snd': sound.on = !sound.on; LS.set('magnat_snd', sound.on); if (sound.on) { audioUnlock(); setTimeout(() => sfx('salary'), 60); toast('Son activé'); } else toast('Son coupé'); if (S && S.phase !== 'lobby') renderSide(); else render(); break;
    case 'leave':
      if (amHost()) { if (!confirm(isLocal() ? 'Quitter et effacer cette partie ?' : 'Quitter ferme le salon pour tout le monde. Continuer ?')) return; LS.del('magnat_save'); }
      else if (S && S.phase === 'lobby') doAct(net.myId, { type: 'leaveLobby' });
      goHome(); break;
    case 'copy': (navigator.clipboard ? navigator.clipboard.writeText(d.v) : Promise.reject()).then(() => toast('Lien copié'), () => prompt('Copie ce lien :', d.v)); break;
    case 'l-color': { const free = PLAYER_COLORS.filter(c => !S.players.some(p => p.color === c)), p = P(S, d.id); if (!free.length || !p) return;
      const next = free.find(c => PLAYER_COLORS.indexOf(c) > PLAYER_COLORS.indexOf(p.color)) || free[0]; doAct(amHost() ? actorHost() : net.myId, { type: 'setColor', id: d.id, color: next }); break; }
    case 'l-remove': doAct(actorHost(), { type: 'remove', id: d.id }); break;
    case 'l-bot': doAct(actorHost(), { type: 'addPlayer', bot: true }); break;
    case 'l-map': doAct(actorHost(), { type: 'setMap', mapId: d.id }); break;
    case 'l-start': doAct(actorHost(), { type: 'start' }); break;
    case 'rematch': doAct(actorHost(), { type: 'rematch' }); break;
    case 'kick': if (confirm('Exclure ce joueur ? Ses terrains retournent à la banque.')) doAct(actorHost(), { type: 'kick', id: d.id }); break;
    case 'act': doAct(S.players[S.turn].id, { type: d.t }); break;
    case 'bankrupt': if (confirm('Abandonner ? Tu es éliminé et tes terrains passent à ton créancier.')) doAct(d.id, { type: 'bankrupt' }); break;
    case 'bid': doAct(d.id, { type: 'bid', amount: +d.v }); break;
    case 'pass': doAct(d.id, { type: 'pass' }); break;
    case 'bid-custom': if (S.phase === 'auction') bidCustom(d.id); break;
    case 'tile': ui.modal = { type: 'tile', i: +d.i }; renderModal(); break;
    case 'manage': doAct(d.p, { type: d.t, tile: +d.i }); break;
    case 'close': closeModal(); break;
    case 'trade-open': { const me = viewPlayer(); if (!me) return; ui.draft = { from: me.id, to: d.id, give: { cash: 0, props: [], cards: 0 }, get: { cash: 0, props: [], cards: 0 } }; ui.modal = { type: 'trade' }; renderModal(); break; }
    case 'tr-toggle': { const arr = ui.draft[d.s].props, i = +d.i, k = arr.indexOf(i); if (k >= 0) arr.splice(k, 1); else arr.push(i); renderModal(); break; }
    case 'tr-card': ui.draft[d.s].cards = ui.draft[d.s].cards ? 0 : 1; renderModal(); break;
    case 'tr-send': { const dr = ui.draft; doAct(dr.from, { type: 'tradePropose', trade: { to: dr.to, give: dr.give, get: dr.get } }); closeModal(); break; }
    case 't-accept': doAct(d.p, { type: 'tradeAccept', id: +d.id }); break;
    case 't-decline': doAct(d.p, { type: 'tradeDecline', id: +d.id }); break;
  }
});
document.addEventListener('pointermove', e => {
  const d = e.target.closest && e.target.closest('.deed'); if (!d || e.pointerType === 'touch') return;
  if (e.buttons || e.target.closest('.btn')) return; // la carte ne bouge pas sous un bouton ou pendant un clic
  const r = d.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  d.style.setProperty('--ry', ((x - .5) * 14).toFixed(2) + 'deg'); d.style.setProperty('--rx', ((.5 - y) * 10).toFixed(2) + 'deg');
  d.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); d.style.setProperty('--my', (y * 100).toFixed(1) + '%'); d.classList.add('tilt');
});
document.addEventListener('pointerout', e => { const d = e.target.closest && e.target.closest('.deed'); if (d && !d.contains(e.relatedTarget)) { d.classList.remove('tilt'); d.style.setProperty('--rx', '0deg'); d.style.setProperty('--ry', '0deg'); } });
document.addEventListener('input', e => { const bi = e.target.dataset && e.target.dataset.bidin; if (bi) { ui.bidDraft = ui.bidDraft || {}; ui.bidDraft[bi] = e.target.value; } const s = e.target.dataset && e.target.dataset.cash; if (s && ui.draft) ui.draft[s].cash = Math.max(0, parseInt(e.target.value, 10) || 0); });
document.addEventListener('change', e => {
  const rn = e.target.dataset && e.target.dataset.rename; if (!rn || !S || S.phase !== 'lobby') return;
  const v = e.target.value.trim(), p = P(S, rn); if (!p) return; if (!v || v === p.name) { e.target.value = p.name; return; }
  if (rn === net.myId || isLocal() && p === S.players[0]) { net.name = v.slice(0, 14); LS.set('magnat_name', net.name); }
  doAct(rn === net.myId && !amHost() ? net.myId : actorHost(), { type: 'rename', id: rn, name: v });
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.set; if (k && S) doAct(actorHost(), { type: 'setSetting', key: k, value: e.target.type === 'checkbox' ? e.target.checked : e.target.value }); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) closeModal();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.rename) { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.bidin && S && S.phase === 'auction') { e.preventDefault(); bidCustom(e.target.dataset.bidin); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pick')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const id = e.target.id;
  if (id === 'gatef') { const h = sha256($('#gatein').value.trim()); if (h === ACCESS_HASH) { LS.set('magnat_gate', h); ui.gateOk = true; render(); } else { $('#gateerr').textContent = 'Mauvais code.'; const f = $('#gatef'); f.classList.remove('intro', 'shake'); void f.offsetWidth; f.classList.add('shake'); } }
  else if (id === 'joinf') { readName(); const code = $('#code').value.replace(/[^a-z0-9]/gi, '').toUpperCase(); if (code.length !== 5) { ui.homeErr = 'Le code du salon fait 5 caractères.'; return render(); } clientStart(code); }
  else if (id === 'addlocalf') { const v = $('#localname').value.trim(); if (v) doAct(actorHost(), { type: 'addPlayer', name: v }); }
  else if (id === 'chatf') { const inp = $('#chatin'), m = inp.value.trim(); if (!m) return; const me = viewPlayer() || P(S, net.myId); if (me) doAct(me.id, { type: 'chat', m }); inp.value = ''; }
});
window.addEventListener('beforeunload', e => { if (S && S.phase !== 'lobby' && S.phase !== 'over' && net.mode === 'host') { e.preventDefault(); e.returnValue = ''; } });
render();

</script>
